name: Frontend
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:integration
      - name: Build F1 preview
        run: npm run build
        env:
          NEXT_PUBLIC_BAMAS_DEMO_ONLY: 'true'
      - name: Check phone preview isolation
        run: npx playwright test --config=playwright.preview.config.ts
        env:
          NEXT_PUBLIC_BAMAS_DEMO_ONLY: 'true'
